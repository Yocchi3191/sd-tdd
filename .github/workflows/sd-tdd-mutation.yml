name: sd-tdd mutation testing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sd-tdd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run mutation testing
        run: npm run test:mutation
