name: Bump plugin version

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'

concurrency:
  group: bump-plugin-version
  cancel-in-progress: false

# This workflow relies on the default GITHUB_TOKEN (not a PAT) for checkout/push.
# Pushes made with the default GITHUB_TOKEN do not retrigger `on: push` workflows,
# which is the sole guard against this workflow infinitely retriggering itself on
# its own version-bump commits. Do NOT swap in a PAT or app token here.
permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed plugins
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # 新規/再作成されたブランチへの最初のpushではbeforeが全ゼロSHAになる。
          # その場合はafterの直前コミットとの差分にフォールバックする。
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
            DIFF_RANGE="${AFTER_SHA}^..${AFTER_SHA}"
          else
            DIFF_RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          CHANGED=$(git diff --name-only $DIFF_RANGE -- 'plugins/*/**' \
            | sed -E 's#^plugins/([^/]+)/.*#\1#' \
            | sort -u | tr '\n' ' ')
          echo "plugins=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        if: steps.detect.outputs.plugins != ''
        env:
          CHANGED_PLUGINS: ${{ steps.detect.outputs.plugins }}
        run: node .github/scripts/bump-plugin-version/cli.js $CHANGED_PLUGINS

      - name: Commit version bump
        if: steps.bump.outputs.commit_message != ''
        env:
          CHANGED_PLUGINS: ${{ steps.detect.outputs.plugins }}
          COMMIT_MESSAGE: ${{ steps.bump.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in $CHANGED_PLUGINS; do
            # 削除・リネームされたプラグインはcli.js側でスキップされファイルが
            # 存在しないので、addも対応して見送る。
            if [ -f "plugins/$p/.claude-plugin/plugin.json" ]; then
              git add "plugins/$p/.claude-plugin/plugin.json"
            fi
            if [ -f "plugins/$p/package.json" ]; then
              git add "plugins/$p/package.json"
            fi
          done
          git add .claude-plugin/marketplace.json
          git commit -m "$COMMIT_MESSAGE"
          git push

      - name: Tag release
        if: steps.bump.outputs.tags != ''
        env:
          TAGS: ${{ steps.bump.outputs.tags }}
        run: |
          for t in $TAGS; do
            git tag "$t"
            git push origin "$t" || echo "tag already exists, skipping"
          done
